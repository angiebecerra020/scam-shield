<!--
  setup.html — The steps to finish setting up a senior's phone.

  How it fits in: once a senior says YES, the dashboard (index.html) and
  their card in "Your family" link here, at /setup/<enrollment id>. The
  family keeps this page open while they set up the senior's phone, so each
  step is short and the codes to dial are big. setup.js fills in the steps
  for a cell phone or a landline.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="How to finish setting up Scam Shield on their phone.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1C1C1C">
  <link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <title data-text="setup.pageTitle">Set up their phone · Scam Shield</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Source+Sans+3:wght@400;600&display=swap">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/header.css">
</head>
<body class="with-header">
  <!-- The header with the logo and tabs (Log out lives here too). nav.js fills it in. -->
  <header id="site-header" class="site-header"></header>

  <main class="card">
    <a href="/dashboard" class="back-link" data-text="setup.back">← Back to dashboard</a>
    <h1 id="setup-title">Set up their phone</h1>
    <!-- "Loading…", the steps' intro, or what went wrong (setup.js) -->
    <p id="setup-message" aria-live="polite">Loading…</p>
    <!-- The numbered steps (setup.js) -->
    <ol id="setup-steps" class="setup-steps" hidden></ol>
    <!-- How to turn it off later -->
    <section id="setup-off" class="panel" hidden>
      <h2 data-text="setup.offTitle">To turn it off later</h2>
      <p id="setup-off-text"></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
  <script src="/static/strings.js"></script>
  <script src="/static/i18n.js"></script>
  <script src="/static/auth.js"></script>
  <script src="/static/busy.js"></script>
  <script src="/static/nav.js"></script>
  <script src="/static/setup.js"></script>
</body>
</html>
