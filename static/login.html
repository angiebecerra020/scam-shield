<!--
  login.html — Where family members log in or make an account.

  How it fits in: the web server (app/main.py) sends this page at /login.
  Supabase keeps the accounts (see static/auth.js and app/auth.py). After
  logging in, the person goes to the dashboard at /dashboard.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-text="login.pageTitle">Log in · Scam Shield</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="with-header">
  <!-- The header with the logo and links. nav.js fills it in. -->
  <header id="site-header" class="site-header"></header>

  <main class="card">

    <!-- The two buttons switch the form between "log in" and "sign up" -->
    <div class="tabs" role="group" aria-label="Log in or make an account" data-text-aria-label="login.tabsAria">
      <button type="button" id="tab-login" class="tab" aria-pressed="true" data-text="login.tabLogIn">Log in</button>
      <button type="button" id="tab-signup" class="tab" aria-pressed="false" data-text="login.tabSignUp">Sign up</button>
    </div>

    <form id="login-form" class="form">
      <h1 id="login-title" data-text="login.titleLogIn">Welcome back</h1>
      <p id="login-hint" class="hint" data-text="login.hintLogIn">Log in to see the calls you're protecting.</p>

      <label><span data-text="login.email">Email</span> <input name="email" type="email" required autocomplete="email"></label>
      <label><span data-text="login.password">Password</span>
        <input name="password" type="password" required minlength="6" autocomplete="current-password">
      </label>

      <button type="submit" id="login-button" data-text="login.buttonLogIn">Log in</button>
      <p id="login-error" class="error" role="alert"></p>
      <p id="login-message" class="success" aria-live="polite"></p>
    </form>

    <!-- Shown instead of the form when Supabase isn't set up in .env -->
    <section id="login-off" class="panel" hidden>
      <p class="badge" data-text="login.offBadge">Login is off</p>
      <p data-text="login.off">Logins aren't set up on this server yet, so the dashboard is open to anyone.</p>
      <a class="button" href="/dashboard" data-text="login.goToDashboard">Go to the dashboard</a>
    </section>

    <p class="hint"><a href="/" data-text="login.home">Back to the home page</a></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
  <script src="/static/strings.js"></script>
  <script src="/static/i18n.js"></script>
  <script src="/static/auth.js"></script>
  <script src="/static/busy.js"></script>
  <script src="/static/nav.js"></script>
  <script src="/static/login.js"></script>
</body>
</html>
